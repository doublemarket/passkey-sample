name: Test

on:
  push:
    branches:
      - "**"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            passkey-auth-app/backend/package-lock.json
            PasskeyAuthApp/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: passkey-auth-app/backend

      - name: Run backend tests
        run: node --test tests/models.test.js
        working-directory: passkey-auth-app/backend

      - name: Install mobile app dependencies
        run: npm ci
        working-directory: PasskeyAuthApp

      - name: Run mobile app tests
        run: npm test -- --runTestsByPath __tests__/services/api.test.ts
        working-directory: PasskeyAuthApp
